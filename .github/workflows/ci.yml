name: CI

on:
  push:
    branches: [main]
  # No branch filter on pull_request: a PR is tested whatever it targets. The
  # filter here was boilerplate, and it silently skipped every PR in a stack
  # except the one based on main, leaving the rest green on a 3-second check.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze + format + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze
        run: dart analyze

      - name: Test release tooling
        run: dart tool/publish_closeout_test.dart

      - name: Format check
        # Generated Dart is excluded. Emitter output is not hand-maintained, its
        # layout is the emitter's business, and it drifts across `dart format`
        # versions independently of anything a change here can control. `dart
        # analyze` still covers it, which is the check that matters for
        # generated code.
        run: |
          find packages apps tool -name '*.dart' \
            -not -name '*.g.dart' \
            -not -path '*/test/generated/*' \
            -not -path '*/restage.generated/*' \
            -not -path '*/.dart_tool/*' -print0 \
            | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Test (suites that fit the runner)
        # The analyzer-heavy build suites (restage_codegen, rfw_catalog_compiler)
        # peak past a hosted runner's memory; they're validated by the maintainers
        # locally. CI runs the suites that fit — every Flutter widget suite
        # (including the rfw wire-format goldens in restage_core) and the
        # lightweight Dart packages.
        run: |
          melos run test:dart --scope="rfw_catalog_schema,restage_shared,restage_mcp,restage_cli"
          melos run test:flutter --no-select
