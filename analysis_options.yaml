include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore
    # Packages in this workspace depend on their siblings by path. The publish
    # pipeline rewrites those to hosted version constraints before upload, and
    # `pub publish` refuses a path dependency outright, so a path dep can never
    # reach pub.dev — this warning's failure mode is unreachable here.
    invalid_dependency: ignore
  exclude:
    # Generated build outputs (e.g. a static-site build tree) that are
    # .gitignored but may exist locally after a build. CI never sees these
    # (fresh checkout); excluding them keeps local `dart analyze` clean.
    - '**/build/**'
