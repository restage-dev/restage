# The hosted demos read RESTAGE_BASE_URL and RESTAGE_API_KEY from --dart-define.
# Run build_runner with the same two variables set so the startup request is
# built into the app: RESTAGE_BASE_URL=... RESTAGE_API_KEY=... dart run build_runner build
# (or `early_request: false` under the restage_early_template options).
additional_public_assets:
  - .restage/measurement-state.json
  - .restage/wire-ids.events.jsonl

# The gallery compares source widgets with bundled RFW artifacts.
# Ordinary apps can use generated mounts and compiled fallbacks with bundling off.
# Keep this option identical across the surface builders.
targets:
  $default:
    builders:
      restage_codegen:restage_source_roster:
        options:
          bundled_runtime: true
      restage_codegen:restage_package_surface_compiler:
        options:
          bundled_runtime: true
      restage_codegen:generated_dart:
        options:
          bundled_runtime: true
      restage_codegen:outputs:
        options:
          bundled_runtime: true
