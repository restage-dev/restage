name: restage
description: >-
  Server-driven UI for Flutter. Build any surface — onboarding, messages, surveys,
  paywalls — in your own Flutter widgets and ship updates over the air.
  Content, not code.
version: 2.0.0
repository: https://github.com/restage-dev/restage
homepage: https://restage.dev
issue_tracker: https://github.com/restage-dev/restage/issues
topics:
  - server-driven-ui
  - remote-ui
  - flutter
environment:
  sdk: ^3.5.0
  # >=3.41: the SDK is built and verified against current stable Flutter.
  # The theme channel relies on recent dart:ui APIs (Color.toARGB32, the
  # modern FontWeight value/constructor) absent from older stable lines.
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.0
  # Reads the operating-system version on Android, iOS and macOS. No runtime
  # permission on any platform.
  device_info_plus: '>=11.5.0 <14.0.0'
  http: ^1.2.0
  restage_core:
    path: ../restage_core
  restage_cupertino:
    path: ../restage_cupertino
  restage_material: ">=2.0.0 <3.0.0"
  restage_measurement_schema:
    path: ../restage_measurement_schema
  restage_shared:
    path: ../restage_shared
  meta: ^1.15.0
  # Root-isolate-only application-support path resolution for the bounded
  # worker-owned measurement journal. The worker receives only the plain path.
  path_provider: ^2.1.0
  package_info_plus: ^8.3.1
  # Capped below 1.2.0 deliberately. The build-time toolchain encodes blobs with
  # a vendored, frozen copy of the rfw formats codec, while this runtime decodes
  # with the published rfw. A breaking binary-format change in a future minor
  # would let the runtime decode server blobs differently than they were written.
  # The cross-codec parity test (restage_core) verifies the two codecs agree;
  # raise this ceiling only after re-vendoring and re-running that parity gate.
  rfw: ">=1.1.3 <1.2.0"
  shared_preferences: ^2.5.0
  web_socket_channel: ^3.0.3

dev_dependencies:
  shared_preferences_platform_interface: ^2.4.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
