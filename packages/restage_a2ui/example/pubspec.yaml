name: restage_a2ui_example
description: >-
  End-to-end example: annotate Flutter widgets with @RestageWidget, run
  build_runner, and render the generated A2UI catalog with a2ui_flutter.
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The Flutter runtime the generated catalog targets.
  a2ui_flutter: 0.0.1-wip003
  # The pinned A2UI 1.0 candidate protocol model.
  a2ui_core: ^0.4.0
  # The generated catalog's data schemas are built with json_schema_builder.
  json_schema_builder: ^0.1.7
  # The app-side pre-render check + the capability sidecar.
  restage_a2ui:
    path: ../
  # The @RestageWidget / @RestageProperty / @RestageLibrary annotations.
  rfw_catalog_schema:
    path: ../../rfw_catalog_schema

dev_dependencies:
  # The build-time toolchain that emits the A2UI catalog from the annotations.
  restage_codegen:
    path: ../../restage_codegen
  build_runner: ">=2.4.0 <3.0.0"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Tests build a capability sidecar (CapabilityManifest / LibraryRequirement).
  restage_shared:
    path: ../../restage_shared
