name: restage_a2ui
description: >-
  Fail-closed pre-render capability checks and the Restage capability sidecar
  for apps rendering cached A2UI (a2ui_flutter) surfaces.
version: 0.2.0
repository: https://github.com/restage-dev/restage
homepage: https://restage.dev
issue_tracker: https://github.com/restage-dev/restage/issues
topics:
  - server-driven-ui
  - remote-ui
  - flutter

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  restage_shared:
    path: ../restage_shared
  a2ui_flutter: ^0.3.0
  # The A2UI 1.0 protocol and validation model.
  a2ui_core: ^0.7.0

dev_dependencies:
  flutter_lints: ^6.0.0
  # Test-only: generated test catalogs build their data schemas with it.
  json_schema_builder: ^0.1.7
  flutter_test:
    sdk: flutter
  # Test-only: the interactive-proof fixture carries real A2UI target
  # configuration so the proof can read the write-back pairing through the
  # production target-config reader.
  rfw_catalog_schema:
    path: ../rfw_catalog_schema
  # Test-only: the A2UI package version-pin tripwire parses pubspec.lock (YAML).
  yaml: ^3.1.3
