builders:
  # Placement options are accepted identically on every placement-affected
  # builder key, with identical defaults. Build Runner has no cross-builder
  # options channel, so a consumer repeats the same target options on each
  # key (a YAML anchor writes the values once). Root global_options is not a
  # remedy: it is itself keyed per builder, and it overrides the options
  # every package in the build sets for itself. A package that configures
  # one key and not another gets a loud "placement options divergence
  # between Restage builder targets" error rather than a silently missing
  # output.
  restage_source_roster:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['restageSourceRosterBuilder']
    build_extensions:
      $package$:
        - "assets/restage/source-index.json"
        - "assets/restage/output-roster.json"
    auto_apply: dependents
    build_to: source
    runs_before:
      - 'restage_codegen:paywall_codegen'
      - 'restage_codegen:paywall_flow_codegen'
      - 'restage_codegen:onboarding_screen_codegen'
      - 'restage_codegen:onboarding_flow_codegen'
      - 'restage_codegen:message_screen_codegen'
      - 'restage_codegen:message_flow_codegen'
      - 'restage_codegen:survey_screen_codegen'
      - 'restage_codegen:survey_flow_codegen'
      - 'restage_codegen:restage_package_surface_compiler'
      - 'restage_codegen:outputs'
      - 'restage_codegen:generated_dart'
      - 'restage_codegen:user_catalog'
      - 'restage_codegen:user_catalog_json'
      - 'restage_codegen:factory_functions'
      - 'restage_codegen:user_factories'

  restage_package_surface_compiler:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['restagePackageSurfaceCompilerBuilder']
    build_extensions:
      $package$:
        - "lib/src/surface_publication/surface_publication.compiler.json"
        - "lib/src/measurement/restage.measurement.compiler.json"
    auto_apply: dependents
    build_to: source
    runs_before:
      - 'restage_codegen:outputs'
      - 'restage_codegen:generated_dart'

  # The single owner of per-library generated Dart. One builder declares and
  # writes the whole `<stem>.restage.g.dart` family, so a library declaring a
  # screen, a flow, or both still has exactly one generated part with one
  # claimant. build_extensions below is the default-options resolution; a
  # package configuring `source_output_layout` or `dart_output_root` gets a
  # runtime buildExtensions resolved from the same placement plan.
  generated_dart:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['restageGeneratedDartBuilder']
    build_extensions:
      "{{dir}}/{{file}}.dart":
        - "{{dir}}/restage.generated/{{file}}.restage.g.dart"
    auto_apply: dependents
    build_to: source
    runs_before: []

  # The single static materialization boundary for portable output: one
  # deterministic bundle per authored library, its optional inspection
  # report, and the package-wide output index plus publication manifest.
  # buildExtensions below is the default-options resolution (no
  # inspection_report, no dart_output_root/output_root/bundled_runtime);
  # a package configuring those options gets a runtime buildExtensions that
  # differs from this static default, per the placement plan's own
  # precedence rules.
  outputs:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['restageOutputsBuilder']
    build_extensions:
      "{{dir}}/{{file}}.dart":
        - "{{dir}}/restage.generated/{{file}}.rsbundle"
      $package$:
        - "lib/generated/restage.outputs.json"
        - "lib/generated/restage.publication.json"
        - "lib/generated/restage.measurement.index.json"
    auto_apply: dependents
    build_to: source
    runs_before: []

  paywall_codegen:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['restageCodegenBuilder']
    build_extensions:
      "lib/paywalls/{{name}}.dart":
        - "assets/paywalls/{{name}}.rfwtxt"
        - "assets/paywalls/{{name}}.rfw"
        - "assets/paywalls/{{name}}.capability.json"
        - "assets/paywalls/{{name}}.navplan.json"
        - "assets/paywalls/screens/paywall_{{name}}.rfw"
        - "assets/paywalls/screens/paywall_{{name}}.capability.json"
      "lib/paywalls/{{name}}.rfwtxt":
        - "assets/paywalls/{{name}}.rfw"
        - "assets/paywalls/{{name}}.capability.json"
    auto_apply: dependents
    build_to: source
    defaults:
      options:
        aggregate_canonical_owner: true
    runs_before: ['restage_codegen:paywall_flow_codegen']
  paywall_flow_codegen:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['paywallFlowBuilder']
    build_extensions:
      "lib/paywalls/{{name}}.dart":
        - "assets/paywalls/{{name}}.flow.json"
    auto_apply: dependents
    build_to: source
    defaults:
      options:
        aggregate_canonical_owner: true
    runs_before:
      - 'restage_codegen:restage_package_surface_compiler'
  onboarding_screen_codegen:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['onboardingScreenBuilder']
    build_extensions:
      "lib/onboarding/screens/{{name}}.dart":
        - "assets/onboarding/screens/{{name}}.rfwtxt"
        - "assets/onboarding/screens/{{name}}.rfw"
        - "assets/onboarding/screens/{{name}}.capability.json"
      "lib/general/screens/{{name}}.dart":
        - "assets/general/screens/{{name}}.rfwtxt"
        - "assets/general/screens/{{name}}.rfw"
        - "assets/general/screens/{{name}}.capability.json"
    auto_apply: dependents
    build_to: source
    defaults:
      options:
        aggregate_canonical_owner: true
    runs_before:
      - 'restage_codegen:onboarding_flow_codegen'
      - 'restage_codegen:restage_package_surface_compiler'
  onboarding_flow_codegen:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['onboardingFlowBuilder']
    build_extensions:
      "lib/onboarding/flows/{{name}}.dart":
        - "assets/onboarding/flows/{{name}}.flow.json"
      "lib/general/flows/{{name}}.dart":
        - "assets/general/flows/{{name}}.flow.json"
    auto_apply: dependents
    build_to: source
    defaults:
      options:
        aggregate_canonical_owner: true
    runs_before:
      - 'restage_codegen:restage_package_surface_compiler'
  message_screen_codegen:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['messageScreenBuilder']
    build_extensions:
      "lib/message/screens/{{name}}.dart":
        - "assets/message/screens/{{name}}.rfwtxt"
        - "assets/message/screens/{{name}}.rfw"
        - "assets/message/screens/{{name}}.capability.json"
    auto_apply: dependents
    build_to: source
    defaults:
      options:
        aggregate_canonical_owner: true
    runs_before:
      - 'restage_codegen:message_flow_codegen'
      - 'restage_codegen:restage_package_surface_compiler'
  message_flow_codegen:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['messageFlowBuilder']
    build_extensions:
      "lib/message/flows/{{name}}.dart":
        - "assets/message/flows/{{name}}.flow.json"
    auto_apply: dependents
    build_to: source
    defaults:
      options:
        aggregate_canonical_owner: true
    runs_before:
      - 'restage_codegen:restage_package_surface_compiler'
  survey_screen_codegen:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['surveyScreenBuilder']
    build_extensions:
      "lib/survey/screens/{{name}}.dart":
        - "assets/survey/screens/{{name}}.rfwtxt"
        - "assets/survey/screens/{{name}}.rfw"
        - "assets/survey/screens/{{name}}.capability.json"
    auto_apply: dependents
    build_to: source
    defaults:
      options:
        aggregate_canonical_owner: true
    runs_before:
      - 'restage_codegen:survey_flow_codegen'
      - 'restage_codegen:restage_package_surface_compiler'
  survey_flow_codegen:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['surveyFlowBuilder']
    build_extensions:
      "lib/survey/flows/{{name}}.dart":
        - "assets/survey/flows/{{name}}.flow.json"
    auto_apply: dependents
    build_to: source
    defaults:
      options:
        aggregate_canonical_owner: true
    runs_before:
      - 'restage_codegen:restage_package_surface_compiler'
  user_catalog:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['userCatalogBuilder']
    build_extensions:
      $lib$:
        - "user_catalog.g.dart"
    auto_apply: dependents
    build_to: source
    # Owns the append to the wire-id event log; run before the JSON emitter so
    # that emitter reads a fully-appended log (race-free) and appends nothing.
    runs_before: ['restage_codegen:user_catalog_json']
  user_catalog_json:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['userCatalogJsonBuilder']
    build_extensions:
      $lib$:
        - "src/widget_catalog/catalog.json"
    auto_apply: dependents
    build_to: source
    runs_before:
      - 'restage_codegen:paywall_codegen'
      - 'restage_codegen:onboarding_screen_codegen'
      - 'restage_codegen:message_screen_codegen'
      - 'restage_codegen:survey_screen_codegen'
      - 'restage_codegen:restage_package_surface_compiler'
      - 'restage_codegen:factory_functions'
  factory_functions:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['factoryFunctionBuilder']
    build_extensions:
      "lib/src/widget_catalog/catalog.json":
        - "lib/src/registration.g.dart"
    auto_apply: dependents
    build_to: source
    runs_before: []
  user_factories:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['userFactoryBuilder']
    build_extensions:
      $lib$:
        - "user_factories.g.dart"
    auto_apply: dependents
    build_to: source
    runs_before: []
  # The importable A2UI catalog Dart plus its producer-facing capability
  # document. build_extensions below is the default-options resolution; a
  # package configuring `dart_output_root` moves the Dart catalog, and one
  # configuring `output_root` moves the producer document into that root's
  # `a2ui/` purpose directory, which may sit outside lib/ — hence the package
  # step rather than a lib-rooted one.
  user_a2ui_catalog:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['userA2uiCatalogBuilder']
    build_extensions:
      $package$:
        - "lib/generated/restage_a2ui_catalog.g.dart"
        - "lib/generated/restage_a2ui_catalog.a2ui.json"
    # Opt-in only: the generated code imports the genui runtime, so this builder
    # must not apply to dependents who don't want an A2UI catalog. A consumer
    # enables it explicitly in their own build.yaml.
    auto_apply: none
    build_to: source
    runs_before: []
  widgetbook_stories:
    import: 'package:restage_codegen/builder.dart'
    builder_factories: ['widgetbookStoryBuilder']
    # The second entry is a required static placeholder: Build Runner wants a
    # declared output here, but the real story filenames are one per annotated
    # class and are only known once the sources are read. `promo_banner` names
    # no widget in this repository; it stands in for that shape.
    build_extensions:
      $lib$:
        - "generated/.restage_widgetbook_story_builder"
        - "restage.generated/promo_banner.stories.dart"
    auto_apply: none
    build_to: source
    runs_before: ['widgetbook:story_builder']
