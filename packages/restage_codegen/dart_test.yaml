# Analyzer- and build_runner-backed fixtures can take several minutes while
# multiple heavy package suites share the workstation. Ten minutes prevents
# ordinary contention from becoming a false timeout without reducing
# concurrency, while retaining a bound for genuinely stuck tests.
timeout: 10m

tags:
  # Live pub.dev fetch + `flutter pub get`. Declared so `@Tags(['network'])`
  # is recognised. The tagged test additionally self-skips unless
  # RESTAGE_PUBDEV_SCAN=1 is set, so the default offline gate stays green
  # without a per-tag exclusion.
  network:
