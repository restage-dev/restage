name: restage_codegen
description: >-
  Write your UI as real Flutter widgets — your own design system, not a dialect —
  and restage_codegen compiles it into the blobs the Restage SDK ships over the air.
version: 1.3.0
repository: https://github.com/restage-dev/restage
homepage: https://restage.dev
issue_tracker: https://github.com/restage-dev/restage/issues
topics:
  - server-driven-ui
  - remote-ui
  - flutter

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  # Ceiling <13.0.0: analyzer 13.0.0 removed `NamedExpression` and changed
  # `ArgumentList.arguments` to `NodeList<Argument>`, which this package's
  # argument-list lowering relies on across many sites, so the code compiles
  # only against analyzer < 13. The migration to the 13+ argument AST is
  # blocked on the test toolchain: on current stable Flutter, `flutter_test`
  # pins a `test_api` that resolves `test` 1.31.0, which itself caps analyzer
  # below 13 — so no resolution that includes both `flutter_test` and
  # `package:test` can reach analyzer 13 yet. Migrate and raise the floor as
  # soon as a stable Flutter pins `test_api` >= 0.7.12. Floor 10.0.0 is the
  # verified-compiling lower bound; earlier majors lack element-model APIs
  # this package uses (e.g. FormalParameterElement).
  analyzer: ">=10.0.0 <13.0.0"
  build: ">=2.4.0 <5.0.0"
  collection: ^1.18.0
  crypto: ^3.0.7
  dart_style: ">=2.3.0 <4.0.0"
  glob: ^2.1.2
  meta: ^1.16.0
  package_config: ">=2.0.0 <4.0.0"
  path: ^1.9.0
  restage_shared:
    path: ../restage_shared
  rfw_catalog_compiler:
    path: ../rfw_catalog_compiler
  rfw_catalog_schema:
    path: ../rfw_catalog_schema

dev_dependencies:
  # Directly imported by the persistent build_runner proof; keep the
  # workspace-resolved version bounded to the currently locked major.
  build_config: ">=1.3.0 <2.0.0"
  build_runner: ">=2.4.0 <3.0.0"
  build_test: ">=2.2.0 <4.0.0"
  # Directly imported by the persistent build_runner proof; keep the
  # workspace-resolved version bounded to the currently locked major.
  built_collection: ">=5.1.1 <6.0.0"
  # Resolves `package:intl/` in the recognizer tests so NumberFormat
  # constructions parse as resolved InstanceCreationExpressions (the
  # element-gated recognition path); not a runtime dependency of the toolchain.
  intl: ^0.20.2
  # Test-only standards oracle for emitted Draft 2020-12 constraint keywords.
  json_schema: 5.2.2
  logging: ^1.2.0
  test: ^1.25.0
  # Parses build.yaml in the build.yaml ↔ Builder.buildExtensions consistency
  # test (the production build_runner reads build.yaml; tests read the getter).
  yaml: ^3.1.2
