name: design_package_probe
description: Temporary probe app resolving material_ui through the real codegen.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  cupertino_ui: ^1.0.0
  restage:
    path: ../packages/restage
  restage_material:
    path: ../packages/restage_material
  restage_core:
    path: ../packages/restage_core
  rfw_catalog_schema:
    path: ../packages/rfw_catalog_schema

dev_dependencies:
  build_runner: ">=2.4.0 <3.0.0"
  restage_codegen:
    path: ../packages/restage_codegen

flutter:
  uses-material-design: true
