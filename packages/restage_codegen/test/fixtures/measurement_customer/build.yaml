          measurement_privacy_policy_revision_id: privacy.customer-v1
          measurement_collection_budget_revision_id: budget.customer-v1
      restage_codegen:generated_dart:
        options:
          bundled_runtime: true
      restage_codegen:outputs:
        options:
          bundled_runtime: true
