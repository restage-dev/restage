name: restage_preview_harness
description: A minimal Flutter entrypoint for hosting isolated RFW previews.
version: 0.1.0
repository: https://github.com/restage-dev/restage
homepage: https://restage.dev
issue_tracker: https://github.com/restage-dev/restage/issues
topics:
  - server-driven-ui
  - remote-ui
  - flutter
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  restage:
    path: ../restage
  restage_preview_host:
    path: ../restage_preview_host
  rfw: ^1.1.3
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
