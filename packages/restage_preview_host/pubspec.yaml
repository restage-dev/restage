name: restage_preview_host
description: A transport-neutral Flutter host for rendering RFW bundles.
version: 0.1.0
repository: https://github.com/restage-dev/restage
homepage: https://restage.dev
issue_tracker: https://github.com/restage-dev/restage/issues
topics:
  - server-driven-ui
  - remote-ui
  - flutter
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  restage:
    path: ../restage
  restage_core:
    path: ../restage_core
  restage_cupertino:
    path: ../restage_cupertino
  restage_material:
    path: ../restage_material
  restage_shared:
    path: ../restage_shared
  rfw: ">=1.1.3 <1.2.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
