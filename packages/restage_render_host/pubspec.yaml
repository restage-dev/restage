name: restage_render_host
description: >-
  Renders a Flutter app's own widgets for a Restage preview. Built into the
  web bundle that `restage build push` generates; apps don't depend on it.
version: 2.0.0
repository: https://github.com/restage-dev/restage
homepage: https://restage.dev
issue_tracker: https://github.com/restage-dev/restage/issues
topics:
  - server-driven-ui
  - remote-ui
  - flutter
environment:
  sdk: ^3.5.0
  flutter: ">=3.41.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  # Released in lockstep with restage, minor for minor.
  restage:
    path: ../restage
  restage_shared:
    path: ../restage_shared
  # Matches the restage runtime's cap; see its pubspec.
  rfw: ">=1.1.3 <1.2.0"
  # Browser messaging for the render bundle entrypoint.
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
