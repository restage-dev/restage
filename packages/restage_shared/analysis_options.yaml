include: ../../analysis_options.yaml

# rfw_formats/ holds copies of a formats library derived from rfw 2.0.0's
# lib/src/dart/, kept identical to their source in upstream rfw's style; the
# analyzer excludes them.
analyzer:
  exclude:
    - 'lib/src/rfw_formats/**'
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
