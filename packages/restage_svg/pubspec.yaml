name: restage_svg
description: Optional native SVG widget catalog for Restage.
version: 0.1.0
repository: https://github.com/restage-dev/restage
homepage: https://restage.dev

environment:
  sdk: ^3.9.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  http: ^1.6.0
  restage_core:
    path: ../restage_core
  rfw: ^1.1.3
  rfw_catalog_schema:
    path: ../rfw_catalog_schema
  vector_graphics: ^1.2.4

dev_dependencies:
  build_runner: ">=2.4.0 <3.0.0"
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  restage_shared:
    path: ../restage_shared
