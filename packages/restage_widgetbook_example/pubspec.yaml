name: restage_widgetbook_example
description: >-
  A tiny design-system-style widget library annotated for Restage, with
  Widgetbook v4 stories generated from the same catalog schema.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

resolution: workspace

dependencies:
  a2ui_core: ^0.1.0
  flutter:
    sdk: flutter
  genui: ^0.10.1
  json_schema_builder: ^0.1.3
  restage:
    path: ../restage
  rfw_catalog_schema:
    path: ../rfw_catalog_schema
  widgetbook: 4.0.0-beta.10

dev_dependencies:
  build_runner: ">=2.4.0 <3.0.0"
  crypto: ^3.0.7
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  restage_codegen:
    path: ../restage_codegen
  rfw: ">=1.1.3 <1.2.0"

flutter:
  uses-material-design: true
