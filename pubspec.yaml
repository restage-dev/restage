name: restage_workspace
publish_to: none

environment:
  sdk: ^3.8.0

# Dart 3 pub workspace. Every package below declares `resolution: workspace`
# and resolves against this single root. Keep this list in sync with the
# package directories.
workspace:
  - packages/rfw_catalog_schema
  - packages/rfw_catalog_compiler
  - packages/restage_shared
  - packages/restage
  - packages/restage_preview_host
  - packages/restage_preview_harness
  - packages/restage_codegen
  - packages/restage_cli
  - packages/restage_mcp
  - packages/restage_core
  - packages/restage_material
  - packages/restage_cupertino
  - packages/restage_revenuecat
  - packages/restage_a2ui
  - packages/restage_a2ui/example
  - packages/restage_widgetbook_example
  - apps/examples
  - apps/widgetbook_example

dev_dependencies:
  melos: ^8.2.2
  very_good_analysis: ^10.2.0

melos:
  scripts:
    analyze:
      description: Run dart analyze across all packages
      exec: dart analyze
    format:
      description: >-
        Format check across all packages. Generated Dart is excluded: its
        layout is the emitter's business and drifts across `dart format`
        versions. Keep this list identical to the CI workflow's.
      run: |
        find packages apps tool -name '*.dart' \
          -not -name '*.g.dart' \
          -not -path '*/test/generated/*' \
          -not -path '*/restage.generated/*' \
          -not -path '*/.dart_tool/*' -print0 \
          | xargs -0 dart format --output=none --set-exit-if-changed
    cli:install:
      description: >-
        Compile the `restage` CLI to a native binary and install it at
        $PUB_CACHE/bin/restage. The compiled binary skips the pub-global
        wrapper's per-invocation snapshot rebuild.
      run: |
        set -euo pipefail
        cd packages/restage_cli
        OUT="${PUB_CACHE:-$HOME/.pub-cache}/bin/restage"
        mkdir -p "$(dirname "$OUT")"
        dart compile exe bin/restage.dart -o "$OUT"
        chmod +x "$OUT"
        echo "Installed: $OUT"
        echo "Run: restage --help"
    test:
      description: Run tests across all test/-bearing packages (delegates).
      run: melos run test:dart && melos run test:flutter
    test:dart:
      description: Run dart test in pure-Dart packages with a test/ directory
      exec: dart test
      packageFilters:
        dirExists: test
        flutter: false
    test:flutter:
      description: Run flutter test in Flutter packages with a test/ directory
      exec: flutter test
      packageFilters:
        dirExists: test
        flutter: true
